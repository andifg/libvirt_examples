---
# Import after control-plane nodes are up (UPI). Blocks until install-complete.

- name: asserts | openshift_install.openshift_configs
  ansible.builtin.include_tasks: asserts.yml

- name: Show openshift-install log path | openshift_install.openshift_configs
  ansible.builtin.debug:
    msg: >-
      Waiting for install-complete (timeout {{ openshift_configs_wait_for_install_timeout }}s).
      Install log: {{ openshift_configs_workdir }}/.openshift_install.log

- name: Wait for OpenShift install-complete via openshift-install
  ansible.builtin.command:
    argv: "{{ _openshift_install_wait_argv }}"
  vars:
    _openshift_install_wait_argv: >-
      {{
        [
          openshift_configs_install_binary_path,
          'wait-for',
          'install-complete',
          '--dir',
          openshift_configs_workdir,
        ]
        + (
          ['--log-level', openshift_configs_wait_for_log_level]
          if openshift_configs_wait_for_log_level | length > 0
          else []
        )
      }}
  register: openshift_configs_wait_for_result
  changed_when: false
  timeout: "{{ openshift_configs_wait_for_install_timeout | int }}"

- name: Show openshift-install install-complete result
  ansible.builtin.debug:
    msg: "{{ openshift_configs_wait_for_result.stdout_lines | default([]) }}"
