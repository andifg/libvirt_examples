---
# present -> define/start/autostart network from templates/network.xml.j2
# absent -> stop and undefine libvirt_network_name
libvirt_network_state: present

# libvirt_network_type: nat (default) → forward + optional host IP/DHCP/IPv6 in templates/network.xml.j2
# libvirt_network_type: isolated → same template, L2-only (no forward, no host IP)
libvirt_network_type: nat

# NAT path uses forward/IP/DHCP vars below; isolated uses only name + bridge.
libvirt_network_name: openshift
libvirt_network_bridge: osbr0
libvirt_network_forward_mode: nat
libvirt_network_ip_address: 192.168.150.1
libvirt_network_ip_netmask: 255.255.255.0
libvirt_network_dhcp_enabled: true
libvirt_network_dhcp_range_start: 192.168.150.2
libvirt_network_dhcp_range_end: 192.168.150.254
# libvirt_network_dhcp_hosts items: mac, ip, name (DHCP lease); optional hostname + ip → <dns> entry in network.xml.j2.
libvirt_network_dhcp_hosts: []
libvirt_network_ipv6_enabled: false
libvirt_network_ipv6_address: 2001:db8:ca2:2::1
libvirt_network_ipv6_prefix: "64"
