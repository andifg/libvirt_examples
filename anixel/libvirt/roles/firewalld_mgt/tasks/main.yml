---
# Destination NAT uses firewalld port_forward (DNAT-style forward to to_addr:toport).

- name: Require Red Hat family OS
  ansible.builtin.assert:
    that:
      - ansible_os_family == "RedHat"
    fail_msg: >-
      This role targets Red Hat family systems only (ansible_os_family: {{ ansible_os_family }}).

- name: Require supported firewalld_mgmt_mode | firewalld_mgmt
  ansible.builtin.assert:
    that:
      - firewalld_mgmt_mode in ['present', 'absent']
    fail_msg: >-
      Set firewalld_mgmt_mode to present or absent.

- name: Require supported firewalld_mgmt_type | firewalld_mgmt
  ansible.builtin.assert:
    that:
      - firewalld_mgmt_type in ['none', 'destination_nat', 'destination_nat_purge', 'source_nat', 'policy']
    fail_msg: >-
      Set firewalld_mgmt_type to none, destination_nat, destination_nat_purge, source_nat, or policy.

- name: Ensure firewalld is installed | firewalld_mgmt
  ansible.builtin.package:
    name:
      - firewalld
      - nftables
    state: present

- name: Ensure firewalld is started and enabled | firewalld_mgmt
  ansible.builtin.systemd_service:
    name: firewalld
    state: started
    enabled: true

- name: Include destination NAT configuration | firewalld_mgmt
  ansible.builtin.include_tasks: destination_nat.yml
  when: firewalld_mgmt_type == 'destination_nat'

- name: Purge all destination NAT forward-ports in zone | firewalld_mgmt
  ansible.builtin.include_tasks: destination_nat_purge.yml
  when: firewalld_mgmt_type == 'destination_nat_purge'

- name: Include source NAT configuration | firewalld_mgmt
  ansible.builtin.include_tasks: source_nat.yml
  when: firewalld_mgmt_type == 'source_nat'

- name: Include firewalld policy configuration | firewalld_mgmt
  ansible.builtin.include_tasks: policy.yml
  when: firewalld_mgmt_type == 'policy'
