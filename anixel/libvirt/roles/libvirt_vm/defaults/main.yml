---
# present -> disk_type_block.yml or disk_type_iso_install.yml
# absent -> tasks/absent.yml (undefine domain and delete volumes)

libvirt_vm_state: present

# Required (present): libvirt_vm_name, libvirt_vm_os_name, libvirt_vm_disk_type (qcow2 | raw | img | iso),
#           and a non-empty libvirt_vm_download_url (OS image or installer ISO per disk_type).
# Optional: libvirt_vm_memory, libvirt_vm_vcpus, libvirt_vm_graphics_type, libvirt_vm_serial_console_enabled,
#           libvirt_vm_iso_install_disk_size_gib, libvirt_vm_iso_install_extra_args, libvirt_vm_iso_install_console,
#           libvirt_vm_autostart,
#           libvirt_vm_networks (non-empty list; each item is passed as-is to community.libvirt.virt_install networks — see examples below),
#           libvirt_vm_cloud_init_enabled, libvirt_vm_cloud_init_user_data, libvirt_vm_cloud_init_disable,
#           libvirt_vm_import_disk_grow (import: qemu-img resize after copy),
#           libvirt_vm_disk_dir (iso mode), libvirt_vm_image_cache_dir, libvirt_vm_images_dir.

libvirt_vm_disk_type: qcow2
# Fetched artifact: OS image URL (qcow2 | raw | img); installer ISO URL when disk_type is iso. Use img for raw disk images (e.g. OPNsense nano .img/.img.bz2).
libvirt_vm_download_url: ""

# osinfo name for virt_install (required; set per guest, e.g. centos-stream10, rhel9.6).
libvirt_vm_os_name: ""

# Optional sha256 (hex) for get_url checksum when downloading libvirt_vm_download_url.
libvirt_vm_download_checksum_sha256: ""

# RHCOS / CoreOS ignition file; passed via virt_install sysinfo fwcfg (disables cloud-init when set).
libvirt_vm_ignition_file_path: ""

libvirt_vm_image_cache_dir: /var/lib/libvirt/image-cache

libvirt_vm_images_dir: /var/lib/libvirt/images
libvirt_vm_disk_dir: "{{ libvirt_vm_images_dir }}/vm-{{ libvirt_vm_name }}"
libvirt_vm_qcow2_download_timeout: 3600

# Import (disk_type_block.yml): qemu-img resize SIZE after copy to vm-<name>.qcow2.
# Empty = keep image size. Examples: "+50G" (add), "120G" (absolute virtual size).
# RHCOS/FCOS grow root on first boot when the block device is larger than the image.
libvirt_vm_import_disk_grow: ""

# libvirt_vm_networks — list of NIC dicts for virt_install (module community.libvirt.virt_install, parameter networks).
# Examples (copy into your playbook vars; keep [] here unless this role file is your inventory):
#
#   One virtio NIC on libvirt network "my-lab":
#     libvirt_vm_networks:
#       - network: my-lab
#
#   Fixed MAC for static DHCP on that network (libvirt_network_dhcp_hosts uses the same mac string):
#     libvirt_vm_networks:
#       - network: my-lab
#         mac:
#           address: "52:54:00:12:34:56"
#
#   Bridge instead of virtual network:
#     libvirt_vm_networks:
#       - bridge: br0
#         model:
#           type: virtio
libvirt_vm_networks: []

libvirt_vm_memory: 2048
libvirt_vm_vcpus: 2
libvirt_vm_graphics_type: none
# Import: virt-install --serial pty when true (ISO install: console fixed in disk_type_iso_install.yml; extra_args from libvirt_vm_iso_install_extra_args).
libvirt_vm_serial_console_enabled: true
libvirt_vm_autostart: true
libvirt_vm_cloud_init_enabled: true
libvirt_vm_cloud_init_disable: true

libvirt_vm_iso_filename: "install.iso"
libvirt_vm_iso_installer_path: "{{ libvirt_vm_disk_dir }}/{{ libvirt_vm_iso_filename }}"
libvirt_vm_iso_install_disk_size_gib: 20
libvirt_vm_iso_install_extra_args: inst.text console=ttyS0,115200n8

libvirt_vm_cloud_init_default: |
  #cloud-config
  user: test
  password: 'hello1234'
  ssh_pwauth: True
  chpasswd: { expire: False }
