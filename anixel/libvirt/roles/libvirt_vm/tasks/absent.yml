# SPDX-License-Identifier: MIT-0
---
# Undefine one libvirt domain, delete attached volume files, and remove staged ignition (image cache untouched).

- name: Force-off libvirt domain | libvirt_vm ({{ libvirt_vm_name }})
  community.libvirt.virt:
    name: "{{ libvirt_vm_name }}"
    state: destroyed
  failed_when: false

- name: Undefine libvirt domain and delete attached volume files | libvirt_vm ({{ libvirt_vm_name }})
  community.libvirt.virt:
    command: undefine
    name: "{{ libvirt_vm_name }}"
    flags:
      - managed_save
      - snapshots_metadata
      - nvram
      - checkpoints_metadata
      - delete_volumes
  failed_when: false

- name: Remove staged CoreOS ignition file | libvirt_vm ({{ libvirt_vm_name }})
  ansible.builtin.file:
    path: "{{ libvirt_vm_images_dir }}/vm-{{ libvirt_vm_name }}.ign"
    state: absent
