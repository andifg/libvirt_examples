---
# Install-from-ISO: fetch installer ISO → virt_install (see task for fixed disk/console/extra_args).

- name: Require ISO install guest variables | libvirt_vm
  ansible.builtin.assert:
    that:
      - libvirt_vm_name is defined
      - libvirt_vm_name | length > 0
      - libvirt_vm_os_name is defined
      - libvirt_vm_os_name | length > 0
      - libvirt_vm_download_url is defined
      - libvirt_vm_download_url | string | length > 0
      - libvirt_vm_networks is defined
      - libvirt_vm_networks | length > 0
    fail_msg: >-
      Set libvirt_vm_name, libvirt_vm_os_name, libvirt_vm_download_url (installer ISO), and a non-empty libvirt_vm_networks list.

- name: Ensure VM disk directory exists | libvirt_vm
  ansible.builtin.file:
    path: "{{ libvirt_vm_disk_dir }}"
    state: directory
    mode: "0755"

- name: Build cloud-init payload for virt_install | libvirt_vm
  when: libvirt_vm_cloud_init_enabled | bool
  ansible.builtin.set_fact:
    libvirt_vm__cloud_init:
      user_data: "{{ libvirt_vm_cloud_init_user_data | default(libvirt_vm_cloud_init_default) }}"
      disable: "{{ libvirt_vm_cloud_init_disable }}"

- name: Download installer ISO to cache | libvirt_vm
  ansible.builtin.get_url:
    url: "{{ libvirt_vm_download_url }}"
    dest: "{{ libvirt_vm_image_cache_dir }}/{{ libvirt_vm_download_url | basename }}"
    mode: "0644"
    timeout: "{{ libvirt_vm_qcow2_download_timeout }}"
    force: false

- name: Copy installer ISO next to install disk | libvirt_vm
  ansible.builtin.copy:
    src: "{{ libvirt_vm_image_cache_dir }}/{{ libvirt_vm_download_url | basename }}"
    dest: "{{ libvirt_vm_iso_installer_path }}"
    remote_src: true
    mode: "0644"
    force: false

