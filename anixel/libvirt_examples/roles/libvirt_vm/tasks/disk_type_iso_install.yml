- name: Create libvirt domain from installer ISO | libvirt_vm
  community.libvirt.virt_install:
    name: "{{ libvirt_vm_name }}"
    memory: "{{ libvirt_vm_memory }}"
    vcpus: "{{ libvirt_vm_vcpus }}"
    location: "{{ libvirt_vm_iso_installer_path }}"
    disks:
      - path: "{{ libvirt_vm_disk_dir }}/vm-{{ libvirt_vm_name }}.qcow2"
        size: "{{ libvirt_vm_iso_install_disk_size_gib }}"
        format: qcow2
        bus: virtio
      - path: "{{ libvirt_vm_iso_installer_path }}"
        format: raw
        readonly: true
        bus: usb
    extra_args: "{{ libvirt_vm_iso_install_extra_args }}"
    graphics:
      type: "{{ libvirt_vm_graphics_type }}"
    console:
      value: pty
      target_type: serial
    install:
      os: "{{ libvirt_vm_os_name }}"
    networks: "{{ libvirt_vm_networks }}"
    autostart: "{{ libvirt_vm_autostart }}"