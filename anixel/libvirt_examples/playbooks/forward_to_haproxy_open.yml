# SPDX-License-Identifier: MIT-0
---
# Single play: libvirt -> OPEN lab network (DHCP + static reservation for HAProxy) -> CentOS Stream
# HAProxy VM -> firewalld DNAT on the hypervisor (port 80 -> haproxy_vm_ip). MAC/IP in play vars.
#
# libvirt_install_username_password: required for libvirt_install (group_vars / host_vars / -e).

- name: HAProxy open-network lab hypervisor
  hosts: all
  become: true
  vars:
    haproxy_net: haproxy-open-lab
    # Guest NIC MAC must match libvirt_network_dhcp_hosts below (QEMU/KVM local range 52:54:00:...).
    haproxy_vm_mac: "52:54:00:ab:cd:11"
    haproxy_vm_ip: "192.168.170.50"
    vm_cache: /var/lib/libvirt/image-cache
    vm_images: /var/lib/libvirt/images
  tasks:
    - name: Packages, cockpit, and libvirtd
      ansible.builtin.include_role:
        name: libvirt_install
      vars:
        libvirt_install_image_cache_dir: "{{ vm_cache }}"
        libvirt_install_images_dir: "{{ vm_images }}"

    - name: Define lab network (OPEN + DHCP; libvirt dnsmasq provides DNS for the network)
      ansible.builtin.include_role:
        name: libvirt_network
      vars:
        libvirt_network_type: open
        libvirt_network_name: "{{ haproxy_net }}"
        libvirt_network_bridge: hvopen0
        libvirt_network_forward_mode: open
        libvirt_network_ip_address: 192.168.170.1
        libvirt_network_ip_netmask: 255.255.255.0
        libvirt_network_dhcp_enabled: true
        libvirt_network_dhcp_range_start: 192.168.170.2
        libvirt_network_dhcp_range_end: 192.168.170.254
        libvirt_network_dhcp_hosts:
          - mac: "{{ haproxy_vm_mac }}"
            ip: "{{ haproxy_vm_ip }}"
        libvirt_network_ipv6_enabled: false

    - name: Enable source NAT for OPEN lab interface on hypervisor
      ansible.builtin.include_role:
        name: firewalld_mgt
      vars: # noqa: var-naming
        firewalld_mgmt_type: source_nat
        firewalld_mgmt_source_nat_interface: hvopen0
        firewalld_mgmt_source_nat_from_zone: trusted
        firewalld_mgmt_source_nat_to_zone: public

    - name: Provision CentOS Stream HAProxy VM
      ansible.builtin.include_role:
        name: libvirt_vm
      vars:
        libvirt_vm_image_cache_dir: "{{ vm_cache }}"
        libvirt_vm_images_dir: "{{ vm_images }}"
        libvirt_vm_qcow2_download_timeout: 3600
        libvirt_vm_name: centos-haproxy-open-vm
        libvirt_vm_disk_type: qcow2
        libvirt_vm_download_url: https://cloud.centos.org/centos/10-stream/x86_64/images/CentOS-Stream-GenericCloud-x86_64-10-latest.x86_64.qcow2
        libvirt_vm_os_name: centos-stream10
        libvirt_vm_networks:
          - network: "{{ haproxy_net }}"
            mac:
              address: "{{ haproxy_vm_mac }}"
        libvirt_vm_cloud_init_disable: false
        libvirt_vm_cloud_init_user_data: |
          #cloud-config
          users:
            - default
            - name: {{ vm_user_name }}
              plain_text_passwd: {{ vm_user_password }}
              lock_passwd: false
              groups: wheel
              sudo: ALL=(ALL) NOPASSWD:ALL
          ssh_pwauth: true
          package_update: true
          packages:
            - firewalld
            - haproxy
          write_files:
            - path: /var/lib/haproxy/surprise.html
              permissions: "0644"
              content: |
                <!DOCTYPE html>
                <html lang="en">
                <head>
                  <meta charset="utf-8" />
                  <meta name="viewport" content="width=device-width, initial-scale=1" />
                  <title>Hello from the lab</title>
                  <style>
                    :root { color-scheme: dark; }
                    * { box-sizing: border-box; }
                    body {
                      margin: 0; min-height: 100vh; display: grid; place-items: center;
                      font-family: ui-sans-serif, system-ui, sans-serif;
                      background: radial-gradient(ellipse at 30% 20%, #2d1b4e 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 80%, #0b3d2e 0%, transparent 45%),
                        linear-gradient(165deg, #0a0a12 0%, #12122a 40%, #0d1520 100%);
                      color: #e8e6f2;
                    }
                    .card {
                      max-width: 34rem; padding: 2.25rem 2.5rem; text-align: center;
                      border-radius: 1.25rem;
                      background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
                      border: 1px solid rgba(255,255,255,0.12);
                      box-shadow: 0 1.5rem 4rem rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
                      backdrop-filter: blur(12px);
                    }
                    h1 {
                      font-weight: 700; font-size: clamp(1.5rem, 4vw, 2rem); letter-spacing: -0.02em;
                      margin: 0 0 0.75rem;
                      background: linear-gradient(120deg, #a78bfa, #34d399, #fcd34d);
                      -webkit-background-clip: text; background-clip: text; color: transparent;
                    }
                    p { margin: 0; line-height: 1.65; opacity: 0.88; font-size: 1.05rem; }
                    .spark {
                      display: inline-block; margin-top: 1.5rem; font-size: 2.25rem;
                      animation: pop 1.2s ease-in-out infinite alternate;
                    }
                    @keyframes pop {
                      from { transform: scale(1) rotate(-6deg); filter: drop-shadow(0 0 0.5rem #a78bfa); }
                      to { transform: scale(1.15) rotate(6deg); filter: drop-shadow(0 0 1.2rem #34d399); }
                    }
                    .footer { margin-top: 1.75rem; font-size: 0.8rem; opacity: 0.45; letter-spacing: 0.08em; text-transform: uppercase; }
                  </style>
                </head>
                <body>
                  <div class="card">
                    <h1>You found the open-network lab</h1>
                    <p>This page is served straight from HAProxy — no extra web stack. Your playbook wired the frontend, the backend answered, and the surprise is that <strong>it was HAProxy all along</strong>.</p>
                    <span class="spark" aria-hidden="true">✨</span>
                    <p class="footer">haproxy-open-lab · forward_to_haproxy_open</p>
                  </div>
                </body>
                </html>
            # After haproxy RPM so defaults exist; avoids losing our cfg to package ordering on some images.
            - path: /etc/haproxy/haproxy.cfg
              defer: true
              permissions: "0644"
              content: |
                global
                    log /dev/log    local0
                    chroot /var/lib/haproxy
                    user haproxy
                    group haproxy
                    daemon
                    maxconn 4096

                defaults
                    mode http
                    log global
                    option httplog
                    timeout connect 10s
                    timeout client 30s
                    timeout server 30s

                frontend fe_web
                    bind *:80
                    default_backend be_surprise

                backend be_surprise
                    http-request return status 200 content-type "text/html; charset=utf-8" file /var/lib/haproxy/surprise.html

                listen stats
                    bind 127.0.0.1:8443
                    stats enable
                    stats uri /stats
                    stats refresh 10s
          runcmd:
            - [systemctl, enable, "--now", firewalld]
            - [firewall-cmd, --permanent, --add-service=http, --add-service=https]
            - [firewall-cmd, --reload]
            - [systemctl, enable, "--now", haproxy]

    - name: DNAT hypervisor TCP 80 to HAProxy guest (firewalld public zone)
      ansible.builtin.include_role:
        name: firewalld_mgt
      vars: # noqa: var-naming
        firewalld_mgmt_type: destination_nat
        firewalld_mgmt_port: "80"
        firewalld_mgmt_to_addr: "{{ haproxy_vm_ip }}"

    # - name: DNAT hypervisor TCP 443 to HAProxy guest (firewalld public zone)
    #   ansible.builtin.include_role:
    #     name: firewalld_mgt
    #   vars:
    #     firewalld_mgmt_type: destination_nat
    #     firewalld_mgmt_port: "443"
    #     firewalld_mgmt_to_addr: "{{ haproxy_vm_ip }}"

    - name: Remove DNAT hypervisor TCP 80 to HAProxy guest (destroy path)
      ansible.builtin.include_role:
        name: firewalld_mgt
        apply:
          tags:
            - destroy
      vars: # noqa: var-naming
        firewalld_mgmt_mode: absent
        firewalld_mgmt_type: destination_nat
        firewalld_mgmt_port: "80"
        firewalld_mgmt_to_addr: "{{ haproxy_vm_ip }}"
      tags: [never, destroy]

    - name: Remove source NAT for OPEN lab interface on hypervisor (destroy path)
      ansible.builtin.include_role:
        name: firewalld_mgt
        apply:
          tags:
            - destroy
      vars: # noqa: var-naming
        firewalld_mgmt_mode: absent
        firewalld_mgmt_type: source_nat
        firewalld_mgmt_source_nat_interface: hvopen0
        firewalld_mgmt_source_nat_from_zone: trusted
        firewalld_mgmt_source_nat_to_zone: public
      tags: [never, destroy]

    - name: Tear down libvirt guests and networks (destroy path)
      ansible.builtin.include_role:
        name: libvirt_emtpy_host
        apply:
          tags:
            - destroy
      tags: [never, destroy]
