---
# Single play: firewalld on the hypervisor (no port-forward) → libvirt → one NAT network with
# DHCP (libvirt’s dnsmasq also serves DNS for guests on that network) → CentOS Stream HAProxy VM
# (same pattern as opnsense_setup.yml HAProxy stanza).
#
# libvirt_install_cockpit_password: required for libvirt_install (group_vars / host_vars / -e).

- name: HAProxy lab hypervisor
  hosts: all
  become: true
  vars:
    haproxy_net: haproxy-lab
    vm_cache: /var/lib/libvirt/image-cache
    vm_images: /var/lib/libvirt/images
  tasks:
    - name: Packages, cockpit, and libvirtd
      ansible.builtin.include_role:
        name: libvirt_install
      vars:
        libvirt_install_image_cache_dir: "{{ vm_cache }}"
        libvirt_install_images_dir: "{{ vm_images }}"

    - name: Install and enable firewalld only (no destination NAT)
      ansible.builtin.include_role:
        name: firewalld_mgt
      vars:
        # Quoted: YAML 1.1 treats bare `none` as null; we need the string so != destination_nat.
        firewalld_mgmt_type: "none"

    - name: Define lab network (NAT + DHCP; libvirt dnsmasq provides DNS for the network)
      ansible.builtin.include_role:
        name: libvirt_network
      vars:
        libvirt_network_type: nat
        libvirt_network_name: "{{ haproxy_net }}"
        libvirt_network_bridge: hvlab0
        libvirt_network_forward_mode: nat
        libvirt_network_ip_address: 192.168.160.1
        libvirt_network_ip_netmask: 255.255.255.0
        libvirt_network_dhcp_enabled: true
        libvirt_network_dhcp_range_start: 192.168.160.2
        libvirt_network_dhcp_range_end: 192.168.160.254
        libvirt_network_ipv6_enabled: false

    - name: Provision CentOS Stream HAProxy VM
      ansible.builtin.include_role:
        name: libvirt_vm
      vars:
        libvirt_vm_image_cache_dir: "{{ vm_cache }}"
        libvirt_vm_images_dir: "{{ vm_images }}"
        libvirt_vm_qcow2_download_timeout: 3600
        libvirt_vm_name: centos-haproxy-vm
        libvirt_vm_disk_type: qcow2
        libvirt_vm_download_url: https://cloud.centos.org/centos/10-stream/x86_64/images/CentOS-Stream-GenericCloud-x86_64-10-latest.x86_64.qcow2
        libvirt_vm_os_name: centos-stream10
        libvirt_vm_networks:
          - network: "{{ haproxy_net }}"
        libvirt_vm_cloud_init_disable: false
        libvirt_vm_cloud_init_user_data: |
          #cloud-config
          users:
            - default
            - name: test
              plain_text_passwd: hello1234
              lock_passwd: false
              groups: wheel
              sudo: ALL=(ALL) NOPASSWD:ALL
          ssh_pwauth: true
          package_update: true
          packages:
            - firewalld
            - haproxy
          write_files:
            - path: /etc/haproxy/haproxy.cfg
              permissions: "0644"
              content: |
                global
                    log /dev/log    local0
                    chroot /var/lib/haproxy
                    stats socket /run/haproxy/admin.sock mode 660 level admin
                    stats timeout 30s
                    user haproxy
                    group haproxy
                    daemon
                    maxconn 4096

                defaults
                    mode http
                    log global
                    option httplog
                    timeout connect 10s
                    timeout client 30s
                    timeout server 30s

                listen stats
                    bind *:80
                    bind *:443
                    stats enable
                    stats uri /
                    stats refresh 10s
          runcmd:
            - [systemctl, enable, "--now", firewalld]
            - [firewall-cmd, --permanent, --add-service=http, --add-service=https]
            - [firewall-cmd, --reload]
            - [systemctl, enable, "--now", haproxy]
